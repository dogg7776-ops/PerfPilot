name: Build PerfPilot APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK platform
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Reassemble and extract source
        run: |
          cat source_chunks/part-*.txt | base64 -d > PerfPilot-source-fixed.zip
          test "$(stat -c%s PerfPilot-source-fixed.zip)" -eq 28573
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q PerfPilot-source-fixed.zip -d buildsrc
          test -f buildsrc/PerfPilot/settings.gradle.kts

      - name: Patch Shizuku compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          shell = Path('buildsrc/PerfPilot/app/src/main/java/com/oai/perfpilot/ShellEngine.kt')
          s = shell.read_text(encoding='utf-8')
          old = '                Mode.SHIZUKU -> Shizuku.newProcess(arrayOf("sh", "-c", command), null, null)'
          new = '                Mode.SHIZUKU -> Runtime.getRuntime().exec(arrayOf("sh", "-c", command))'
          if old not in s:
              raise SystemExit('expected Shizuku.newProcess call not found')
          shell.write_text(s.replace(old, new), encoding='utf-8')

          controller = Path('buildsrc/PerfPilot/app/src/main/java/com/oai/perfpilot/PerfController.kt')
          c = controller.read_text(encoding='utf-8')
          c = c.replace('Shizuku：可执行 shell；多数 /sys 写入仍受 SELinux/权限限制',
                        'Shizuku：已授权；当前构建暂用本地 shell，Root 功能仍需 Root')
          controller.write_text(c, encoding='utf-8')
          PY

      - name: Build debug APK
        working-directory: buildsrc/PerfPilot
        run: gradle --no-daemon :app:assembleDebug

      - name: Copy APK
        run: cp buildsrc/PerfPilot/app/build/outputs/apk/debug/app-debug.apk PerfPilot-v0.2-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PerfPilot-v0.2-debug-apk
          path: PerfPilot-v0.2-debug.apk
          if-no-files-found: error
