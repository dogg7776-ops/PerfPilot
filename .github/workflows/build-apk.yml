name: Build PerfPilot APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK platform
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Reassemble PerfPilot v1 source
        run: |
          cat v1_chunks/part-* | base64 -d > PerfPilot-v1-source.zip
          test "$(stat -c%s PerfPilot-v1-source.zip)" -eq 45565
          unzip -t PerfPilot-v1-source.zip
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q PerfPilot-v1-source.zip -d buildsrc
          test -f buildsrc/perfpilot_v1/settings.gradle.kts
          grep -q 'versionName = "1.0.0"' buildsrc/perfpilot_v1/app/build.gradle.kts

      - name: Build debug APK
        working-directory: buildsrc/perfpilot_v1
        run: gradle --no-daemon :app:assembleDebug

      - name: Copy APK
        run: cp buildsrc/perfpilot_v1/app/build/outputs/apk/debug/app-debug.apk PerfPilot-v1.0-powerhal-glass-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PerfPilot-v1.0-powerhal-glass-debug-apk
          path: PerfPilot-v1.0-powerhal-glass-debug.apk
          if-no-files-found: error
