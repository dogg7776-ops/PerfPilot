name: Build PerfPilot APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK platform
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Reassemble base source
        run: |
          cat source_chunks/part-*.txt | base64 -d > PerfPilot-source-ui.zip
          test "$(stat -c%s PerfPilot-source-ui.zip)" -eq 31092
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q PerfPilot-source-ui.zip -d buildsrc
          test -f buildsrc/PerfPilot/settings.gradle.kts

      - name: Apply v0.4 Shizuku patch
        run: |
          cat v04_patch_chunks/part-* > /tmp/perfpilot-v04.patch
          test "$(stat -c%s /tmp/perfpilot-v04.patch)" -eq 29113
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/perfpilot-v04.patch')
          s = p.read_text(encoding='utf-8').replace('无 "Root', '无 Root')
          p.write_text(s, encoding='utf-8')
          PY
          patch -p1 -d buildsrc/PerfPilot < /tmp/perfpilot-v04.patch
          grep -q 'versionName = "0.4.0"' buildsrc/PerfPilot/app/build.gradle.kts
          test -f buildsrc/PerfPilot/app/src/main/java/com/oai/perfpilot/PrivilegedShellService.kt

      - name: Build debug APK
        working-directory: buildsrc/PerfPilot
        run: gradle --no-daemon :app:assembleDebug

      - name: Copy APK
        run: cp buildsrc/PerfPilot/app/build/outputs/apk/debug/app-debug.apk PerfPilot-v0.4-shizuku-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PerfPilot-v0.4-shizuku-debug-apk
          path: PerfPilot-v0.4-shizuku-debug.apk
          if-no-files-found: error
