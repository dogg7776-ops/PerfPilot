name: Build PerfPilot APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK platform
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Reassemble and extract source
        run: |
          cat source_chunks/part-*.txt | base64 -d > PerfPilot-source-ui.zip
          test "$(stat -c%s PerfPilot-source-ui.zip)" -eq 31092
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q PerfPilot-source-ui.zip -d buildsrc
          test -f buildsrc/PerfPilot/settings.gradle.kts

      - name: Apply crash-safe patch
        run: python3 patch_crashsafe.py

      - name: Build debug APK
        working-directory: buildsrc/PerfPilot
        run: gradle --no-daemon :app:assembleDebug

      - name: Copy APK
        run: cp buildsrc/PerfPilot/app/build/outputs/apk/debug/app-debug.apk PerfPilot-v0.3.2-pagesafe-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PerfPilot-v0.3.2-pagesafe-debug-apk
          path: PerfPilot-v0.3.2-pagesafe-debug.apk
          if-no-files-found: error
