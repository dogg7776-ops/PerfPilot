name: Build PerfPilot APK

on:
  push:
    branches: [ main, rebuild/v1-mtk-backend ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK platform
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Reassemble PerfPilot v1 base source
        run: |
          cat v1_chunks/part-* | base64 -d > PerfPilot-v1-source.zip
          unzip -t PerfPilot-v1-source.zip >/dev/null
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q PerfPilot-v1-source.zip -d buildsrc
          test -f buildsrc/perfpilot_v1/settings.gradle.kts
          test -f buildsrc/perfpilot_v1/app/build.gradle.kts

      - name: Apply K90 Max / Dimensity 9500 beta2 overlay
        run: |
          python3 scripts/apply_beta2.py
          grep -q 'versionName = "1.0.0-beta2-k90"' buildsrc/perfpilot_v1/app/build.gradle.kts
          grep -q 'MT6993' buildsrc/perfpilot_v1/app/src/main/java/com/oai/perfpilot/DeviceProfile.kt

      - name: Static integration and safety checks
        run: python3 scripts/ci_check_beta2.py buildsrc/perfpilot_v1

      - name: Build debug APK
        working-directory: buildsrc/perfpilot_v1
        run: gradle --no-daemon :app:assembleDebug

      - name: Copy APK
        run: cp buildsrc/perfpilot_v1/app/build/outputs/apk/debug/app-debug.apk PerfPilot-v1.0-beta2-k90-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PerfPilot-v1.0-beta2-k90-debug-apk
          path: PerfPilot-v1.0-beta2-k90-debug.apk
          if-no-files-found: error
