name: Build PerfPilot APK

on:
  push:
    branches: [ main, rebuild/v1-mtk-backend ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK platform
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Reassemble trusted PerfPilot base source
        run: |
          cat source_chunks/part-*.txt | base64 -d > PerfPilot-base.zip
          test "$(stat -c%s PerfPilot-base.zip)" -eq 31092
          unzip -t PerfPilot-base.zip >/dev/null
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q PerfPilot-base.zip -d buildsrc
          test -f buildsrc/PerfPilot/settings.gradle.kts
          test -f buildsrc/PerfPilot/app/build.gradle.kts

      - name: Apply proven crash-safe base patch
        run: python3 patch_crashsafe.py

      - name: Apply K90 Max / Dimensity 9500 beta8 usability fixes
        run: |
          python3 scripts/apply_beta2.py
          python3 scripts/patch_beta8.py buildsrc/PerfPilot
          grep -q 'versionName = "1.0.0-beta8-k90-usability"' buildsrc/PerfPilot/app/build.gradle.kts
          grep -q 'MT6993' buildsrc/PerfPilot/app/src/main/java/com/oai/perfpilot/DeviceProfile.kt
          grep -q 'gpu_utilization' buildsrc/PerfPilot/app/src/main/java/com/oai/perfpilot/RuntimeMetricsReader.kt
          grep -q 'set-user-preferred-display-mode' buildsrc/PerfPilot/app/src/main/java/com/oai/perfpilot/PerfController.kt
          grep -q 'OverlayService.isRunning()' buildsrc/PerfPilot/app/src/main/java/com/oai/perfpilot/MainActivity.kt

      - name: Static integration and safety checks
        run: python3 scripts/ci_check_beta2.py buildsrc/PerfPilot

      - name: Build debug APK
        working-directory: buildsrc/PerfPilot
        run: gradle --no-daemon :app:assembleDebug

      - name: Copy APK
        run: cp buildsrc/PerfPilot/app/build/outputs/apk/debug/app-debug.apk PerfPilot-v1.0-beta8-k90-usability-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PerfPilot-v1.0-beta8-k90-usability-debug-apk
          path: PerfPilot-v1.0-beta8-k90-usability-debug.apk
          if-no-files-found: error
